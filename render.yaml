services:
  - type: web
    name: enininkoru
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "true"
    startCommand: python3 server.py --no-browser
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.11
